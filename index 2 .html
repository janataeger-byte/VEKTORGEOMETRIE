<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vektorgeometrie – Interaktives Lernen</title><style>
*{box-sizing:border-box}body{margin:0;background:#0e131a;color:#eee;font:16px system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:24px}header{border-bottom:1px solid #706047;padding:15px 0;color:#cfb68d;letter-spacing:2px;font-size:12px}h1{font:normal 42px Georgia,serif;margin:26px 0 12px}p{color:#b9c0ca;line-height:1.6}nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}a{color:#e5c99b;text-decoration:none}nav a,section{border:1px solid #38424e;background:#161e28;border-radius:12px;padding:20px}nav a{min-width:0;display:block;padding:16px}nav h2{font-size:clamp(16px,2.1vw,22px);line-height:1.25;overflow-wrap:normal;hyphens:auto;margin:12px 0}nav{grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}h1{font-size:clamp(26px,5vw,42px);overflow-wrap:anywhere}nav a:hover{border-color:#e5c99b}small{color:#b8a17e}canvas{width:100%;height:390px;touch-action:none;background:#10161e;border-radius:8px}#controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}label{display:block;color:#d9dee6}input[type=range]{width:100%;accent-color:#d4b37c}button,select{background:#26313d;color:white;border:1px solid #69717a;padding:10px;border-radius:6px}#result{white-space:pre-line;font-size:19px;line-height:1.6;color:#e5c99b}footer{margin-top:25px;color:#aeb6c0;font-size:12px} </style><main><header>MATHEMATIK / INTERAKTIVES LERNEN</header><div id="content"></div><footer>VEKTORGEOMETRIE · INTERAKTIVES BEGLEITMATERIAL</footer></main><script>
const topics=[['ortsvektoren','Ortsvektoren','Ein Ortsvektor führt vom Ursprung O zum Punkt A.'],['verbindungsvektoren','Verbindungsvektoren','Der Verbindungsvektor führt von A nach B.'],['besondere-vektoren','Besondere Vektoren','Untersuche kollineare Vektoren, Gegenvektoren, Einheitsvektoren und den Nullvektor.'],['addition','Vektoraddition','Dreiecksregel und Parallelogrammregel führen zur gleichen Summe.'],['subtraktion','Vektorsubtraktion','Subtraktion bedeutet Addition des Gegenvektors.'],['skalarprodukt','Skalarprodukt','Das Skalarprodukt ist eine Zahl. Sein Vorzeichen hängt vom Winkel ab.'],['skalarmultiplikation','Skalarmultiplikation','Ein Skalar verändert Länge und gegebenenfalls Richtung eines Vektors.']];
const el=id=>document.getElementById(id), add=(a,b)=>a.map((x,i)=>x+b[i]), mul=(a,k)=>a.map(x=>x*k), sub=(a,b)=>add(a,mul(b,-1)), len=a=>Math.hypot(...a), dot=(a,b)=>a.reduce((s,x,i)=>s+x*b[i],0), fmt=x=>Number(x.toFixed(3)).toLocaleString('de-DE'), vec=a=>'('+a.map(fmt).join(' | ')+')'; let state,yaw,pitch,mode,canvas,ctx,topic; const defaults=()=>({a:[2,1,2],b:[-1,2,1],k:2});
function render(){topic=topics.find(t=>t[0]===location.hash.slice(1));if(!topic){el('content').innerHTML='<h1>Vektorgeometrie</h1><p>Mathematik verstehen. Zusammenhänge entdecken.</p><nav>'+topics.map((t,i)=>`<a href="#${t[0]}"><small>0${i+1} / MODUL</small><h2>${t[1]==='Verbindungsvektoren'?'Verbindungs&shy;vektoren':t[1]}</h2>Modell entdecken ↗</a>`).join('')+'</nav>';return} state=defaults();yaw=-.65;pitch=.48;mode='kollinear';el('content').innerHTML=`<p><a href="#">← Alle Module</a></p><h1>${topic[1]}</h1><p>${topic[2]}</p><section><canvas id="plot" aria-label="Drehbares räumliches Koordinatensystem"></canvas><p>Mit Finger oder Maus ziehen, um das Koordinatensystem zu drehen.</p><div id="controls"></div><p id="result" aria-live="polite"></p><button id="reset">Zurücksetzen</button></section>`;canvas=el('plot');ctx=canvas.getContext('2d');let controls=el('controls');function slider(label,arr,i,min,max,step){let l=document.createElement('label'),s=document.createElement('input'),v=document.createElement('span');l.append(label+' ',v,s);s.type='range';s.min=min;s.max=max;s.step=step;s.value=arr[i];v.textContent=fmt(+s.value);s.oninput=()=>{arr[i]=+s.value;v.textContent=fmt(+s.value);draw()};controls.append(l)} for(let i=0;i<3;i++)slider((topic[0]==='ortsvektoren'||topic[0]==='verbindungsvektoren'?'A':'a')+' · '+['x','y','z'][i],state.a,i,-4,4,1);if(['verbindungsvektoren','addition','subtraktion','skalarprodukt'].includes(topic[0]))for(let i=0;i<3;i++)slider((topic[0]==='verbindungsvektoren'?'B':'b')+' · '+['x','y','z'][i],state.b,i,-4,4,1);if(['besondere-vektoren','skalarmultiplikation'].includes(topic[0])){let l=document.createElement('label');l.innerHTML='Skalar k <span id="kv">2</span><input id="ks" type="range" min="-3" max="3" step="0.25" value="2">';controls.append(l);el('ks').oninput=e=>{state.k=+e.target.value;el('kv').textContent=fmt(state.k);draw()}}if(topic[0]==='besondere-vektoren'){let s=document.createElement('select');s.innerHTML='<option value="kollinear">Kollinear</option><option value="gegen">Gegenvektor</option><option value="einheit">Einheitsvektor</option><option value="null">Nullvektor</option>';s.onchange=()=>{mode=s.value;draw()};controls.append(s)}el('reset').onclick=render;let drag=null;canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;yaw+=(e.clientX-drag[0])*.009;pitch=Math.max(-1.5,Math.min(1.5,pitch+(e.clientY-drag[1])*.009));drag=[e.clientX,e.clientY];draw()};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;draw()}
function draw(){if(!topic||!canvas)return;let w=canvas.clientWidth,h=canvas.clientHeight,d=devicePixelRatio||1;canvas.width=w*d;canvas.height=h*d;ctx.setTransform(d,0,0,d,0,0);let {a,b,k}=state,o=[0,0,0],items=[],res='',gold='#e5bb76',white='#f1f4f8',blue='#76b8e8';function ar(s,t,l,c=white,dash=false){items.push({s,t,l,c,dash})}switch(topic[0]){case 'ortsvektoren':ar(o,a,'OA',gold);res='A = '+vec(a)+'\nOA = '+vec(a)+'  |  Länge = '+fmt(len(a));break;case 'verbindungsvektoren':ar(o,a,'A',white,true);ar(o,b,'B',blue,true);ar(a,b,'AB',gold);res='AB = B − A = '+vec(sub(b,a))+'\nLänge = '+fmt(len(sub(b,a)));break;case 'addition':{let s=add(a,b);ar(o,a,'a');ar(o,b,'b',blue);ar(a,s,'b',blue,true);ar(b,s,'a',white,true);ar(o,s,'a + b',gold);res='a + b = '+vec(s);break}case 'subtraktion':{let n=mul(b,-1),s=add(a,n);ar(o,a,'a');ar(o,b,'b',blue);ar(o,n,'−b',blue,true);ar(a,s,'−b',blue,true);ar(n,s,'a',white,true);ar(b,a,'a − b',gold,true);ar(o,s,'a − b',gold);res='a − b = a + (−b) = '+vec(s);break}case 'skalarprodukt':{let z=dot(a,b),ang=len(a)*len(b)?Math.acos(Math.max(-1,Math.min(1,z/(len(a)*len(b)))))*180/Math.PI:null;ar(o,a,'a');ar(o,b,'b',blue);res='a · b = '+fmt(z)+'\nWinkel = '+(ang===null?'nicht definiert':fmt(ang)+'°')+'\n'+(ang===null?'Mindestens ein Nullvektor':z===0?'Orthogonal':z>0?'Spitzer Winkel oder 0°':'Stumpfer Winkel oder 180°');break}default:{let f=topic[0]==='besondere-vektoren'?(mode==='gegen'?-1:mode==='einheit'?(len(a)?1/len(a):0):mode==='null'?0:k):k;let v=mul(a,f);ar(o,v,'Ergebnis',gold);ar(o,a,'a',white);res=mode==='einheit'&&len(a)===0&&topic[0]==='besondere-vektoren'?'Einheitsvektor des Nullvektors nicht definiert.':'Ergebnis = '+vec(v)+'\nLänge: '+fmt(len(a))+' → '+fmt(len(v))+'\n'+(f===0?'Nullvektor':(Math.abs(f)>1?'Streckung':Math.abs(f)<1?'Stauchung':'Gleiche Länge')+(f<0?' · Richtungsumkehr':''));}}
let extent=Math.max(4,...items.flatMap(t=>[...t.s,...t.t].map(Math.abs))),scale=Math.min(w,h)*.39/(extent*1.45);function p(v){let [x,y,z]=v,X=x*Math.cos(yaw)-y*Math.sin(yaw),Y=x*Math.sin(yaw)+y*Math.cos(yaw);return [w/2+scale*X,h/2-scale*(z*Math.cos(pitch)-Y*Math.sin(pitch))]}function line(a,b,c,weight=1,dash=false){let s=p(a),t=p(b);ctx.beginPath();ctx.strokeStyle=c;ctx.lineWidth=weight;ctx.setLineDash(dash?[5,5]:[]);ctx.moveTo(...s);ctx.lineTo(...t);ctx.stroke();ctx.setLineDash([])}let n=Math.ceil(extent);for(let i=-n;i<=n;i++){line([i,-n,0],[i,n,0],'#26313c');line([-n,i,0],[n,i,0],'#26313c')}function arrow(s,t,l,c,dash=false){line(s,t,c,dash?1.6:3,dash);let u=p(s),v=p(t),ang=Math.atan2(v[1]-u[1],v[0]-u[0]);ctx.fillStyle=c;if(Math.hypot(v[0]-u[0],v[1]-u[1])>2){ctx.beginPath();ctx.moveTo(...v);ctx.lineTo(v[0]-10*Math.cos(ang-.45),v[1]-10*Math.sin(ang-.45));ctx.lineTo(v[0]-10*Math.cos(ang+.45),v[1]-10*Math.sin(ang+.45));ctx.fill()}else{ctx.beginPath();ctx.arc(...v,4,0,Math.PI*2);ctx.fill()}ctx.font='13px system-ui';ctx.fillText(l,v[0]+6,v[1]-8)}for(let i=0;i<3;i++){let e=[0,0,0];e[i]=n+0.5;arrow(mul(e,-1),e,['x','y','z'][i],'#8895a4');for(let j=-n;j<=n;j++){if(!j)continue;let v=[0,0,0];v[i]=j;let q=p(v);ctx.fillStyle='#7b8794';ctx.font='10px system-ui';ctx.fillText(j,q[0]+3,q[1]+11)}}for(let t of items)arrow(t.s,t.t,t.l,t.c,t.dash);let q=p(o);ctx.fillStyle='#aaa';ctx.fillText('O',q[0]-12,q[1]+14);el('result').textContent=res}window.addEventListener('hashchange',render);window.addEventListener('resize',()=>{if(topic)draw()});render();</script></html>
